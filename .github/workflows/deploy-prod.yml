name: Deploy production

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: Deploy shaders.deepansh.in
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      AWS_REGION: us-east-1
      AWS_DEFAULT_REGION: us-east-1

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5

      - name: Install dependencies
        run: npm ci

      - name: Test deploy tooling
        run: npm run test:deploy

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: arn:aws:iam::339097327659:role/shader-gallery-prod-github-deploy

      - name: Initialize Terraform outputs
        run: terraform -chdir=infra/prod init -input=false

      - name: Build app
        run: npm run build

      - name: Deploy preflight
        run: npm run deploy:prod -- --preflight

      - name: Deploy app
        run: npm run deploy:prod
